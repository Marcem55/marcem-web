<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gestión de estudio jurídico · Demo MARCEM</title>
<meta name="description" content="Demo con datos ficticios: expedientes, agenda, plazos y escritos de un estudio jurídico. Hecha por MARCEM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430;--ink2:#2A3644;--paper:#F6F4EF;--card:#FFFFFF;--line:#E4E0D6;--line2:#EFECE4;
  --muted:#5E6873;--accent:#7B2D3B;--accent-bg:#F5E9EB;--ok:#2E6B4F;--ok-bg:#E5F1EA;
  --warn:#9A4A12;--warn-bg:#FBEEDF;--danger:#A61B1B;--danger-bg:#FBE7E5;--blue:#2B4E7A;--blue-bg:#E7EEF7;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.demobar{position:fixed;top:0;left:0;right:0;z-index:60;height:38px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px;background:#0E141B;color:#D9DEE4;font-size:12.5px;white-space:nowrap;overflow:hidden}
.demobar b{color:#fff;font-weight:600}
.demobar button{border:0;background:#25D366;color:#fff;font-weight:700;border-radius:999px;padding:5px 12px;font-size:12px;flex-shrink:0}
.demobar .t{overflow:hidden;text-overflow:ellipsis}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;padding-top:38px}
.side{background:var(--ink);color:#E8EBEF;position:sticky;top:38px;height:calc(100vh - 38px);display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}
.brand .seal{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:#fff;font-size:18px;flex-shrink:0}
.brand .n{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.1}
.brand .s{font-size:12px;color:#9AA6B2}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#C9D1D9;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500;font-size:14.5px}
.nav button svg{width:20px;height:20px;flex-shrink:0}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:#fff;color:var(--ink)}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav button.on .badge{background:var(--danger)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid #2F3B48;font-size:13px}
.av{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.main{min-width:0;padding:28px clamp(16px,3vw,40px) 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3.2vw,32px);margin:0;line-height:1.15;letter-spacing:-.2px}
h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:#CFC9BB}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#68242F}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:6px}
.kpi.red .v{color:var(--danger)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.item:first-of-type{border-top:0}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #BDB6A6;background:#fff;flex-shrink:0;margin-top:1px;display:grid;place-items:center;padding:0}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk.done::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .tt{font-weight:600}
.item.done .tt{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.venc{background:var(--danger-bg);color:var(--danger)}
.tag.aud{background:var(--blue-bg);color:var(--blue)}
.tag.tar{background:var(--line2);color:var(--ink2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.arch{background:#ECEDEF;color:#5B6470}
.when{font-weight:700;font-size:13px;min-width:46px;color:var(--blue);margin-top:2px}
.daygrp{margin-top:14px}
.daygrp .dh{font-weight:700;font-size:13px;color:var(--ink2);padding:6px 0;border-bottom:2px solid var(--line);display:flex;justify-content:space-between}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
/* expedientes */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:42px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;padding:9px 0}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
select.inp,input.inp,textarea.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
select.inp{width:auto}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.exps{display:flex;flex-direction:column;gap:10px}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
.exp:hover{border-color:#CFC9BB;box-shadow:0 2px 10px rgba(27,36,48,.05)}
.exp .car{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.exp .dat{font-size:13px;color:var(--muted);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.exp .last{grid-column:1/-1;font-size:13.5px;background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .last b{font-weight:600;color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:2px 0 10px}
/* detalle */
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.back svg{width:16px;height:16px}
.fhead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.fhead .car{font-family:var(--serif);font-size:clamp(19px,2.4vw,24px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.fh1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.fgrid div{min-width:0}
.fgrid .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.fgrid .v{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs .n{font-size:12px;background:var(--line2);border-radius:999px;padding:0 7px;margin-left:4px;color:var(--ink2)}
.mov{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line2)}
.mov:first-child{border-top:0}
.mov .f{font-weight:700;font-size:13.5px}
.mov .x{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.pdf{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--danger);background:var(--danger-bg);border-radius:6px;padding:3px 8px;border:0}
.pdf svg{width:14px;height:14px}
.newest{background:var(--accent-bg);border-radius:10px;padding:12px;margin:0 -12px 4px;border-top:0}
.form{display:grid;gap:10px;background:var(--paper);border:1px dashed #CFC9BB;border-radius:12px;padding:14px;margin-bottom:14px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal button{border:1px solid var(--line2);background:var(--card);border-radius:8px;min-height:64px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal button.out{opacity:.4}
.cal button.inh{background:#F1EEE7}
.cal button.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal button.sel{background:var(--accent-bg);border-color:var(--accent)}
.cal .num{font-weight:700;font-size:13px}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:99px}
.dot.venc{background:var(--danger)}.dot.aud{background:var(--blue)}.dot.tar{background:#9A9384}
.cal .fer{font-size:10.5px;color:var(--warn);font-weight:600;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calhead .m{font-family:var(--serif);font-weight:600;font-size:19px;text-transform:capitalize}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* plazos */
.res{background:var(--ink);color:#fff;border-radius:14px;padding:20px}
.res .k{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#9AA6B2;font-weight:600}
.res .big{font-family:var(--serif);font-size:clamp(26px,3.4vw,34px);font-weight:600;line-height:1.1;margin:4px 0 2px}
.res .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:4px}.res .two>div{min-width:0}.res .big{overflow-wrap:anywhere}
.res .ready{color:#F2C7CE}
.res .note{font-size:13px;color:#C9D1D9;margin-top:14px;padding-top:14px;border-top:1px solid #2F3B48}
.skip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.skip span{font-size:12px;background:#2A3644;border-radius:6px;padding:3px 8px;color:#DDE3E9}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.ferlist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;font-size:13.5px}
.ferlist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2);padding:5px 0}
.ferlist .d{font-weight:600;white-space:nowrap}
/* escritos */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tpl{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tpl:hover{border-color:var(--accent)}
.tpl .n{font-weight:600}
.tpl .d{font-size:13px;color:var(--muted)}
.esc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.esc:first-child{border-top:0}
.esc .n{font-weight:600}
.esc .m{font-size:13px;color:var(--muted)}
.lock{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-bottom:10px}
.lock svg{width:18px;height:18px;flex-shrink:0}
.editor{width:100%;min-height:380px;border:1px solid var(--line);border-radius:12px;padding:28px clamp(16px,4vw,48px);background:#fff;font-family:var(--serif);font-size:16px;line-height:1.7;resize:vertical;outline:0;box-shadow:0 1px 0 var(--line2),0 8px 24px rgba(27,36,48,.06)}
.editor[readonly]{background:#FBFAF7;color:#47505A}
.edbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.vers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.vers button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.vers button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(14,20,27,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;max-height:calc(100vh - 32px);overflow:auto}
.wa{background:#E7FFDB;border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:95;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:70px}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex-direction:row}
  .brand,.me{display:none}
  .nav{flex-direction:row;width:100%;gap:2px}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:11px;position:relative;min-width:0}
  .nav button span.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;padding:0 5px;font-size:10px}
  .main{padding-top:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mov{grid-template-columns:minmax(0,1fr);gap:2px}
  .cal button{min-height:46px;padding:4px}
  .cal .fer{display:none}
  .res .two{grid-template-columns:minmax(0,1fr)}
  .demobar .t .long{display:none}
  .fh1{flex-direction:column-reverse;gap:8px}
  .nav button{font-size:10px}
  .tabs button{padding:10px 9px}
  .toast{bottom:86px}
}
</style>
</head>
<body>
<div class="demobar"><span class="t"><b>Demo con datos ficticios</b><span class="long"> · sistema para estudio jurídico</span> · hecha por MARCEM</span><button type="button" onclick="quiero()">Quiero uno así</button></div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="seal">E</div><div><div class="n">Estudio Ejemplo</div><div class="s">Abogados · San Nicolás</div></div></div>
    <nav class="nav" id="nav">
      <button data-v="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lb">Hoy</span><span class="badge" id="bHoy"></span></button>
      <button data-v="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lb">Expedientes</span></button>
      <button data-v="age"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="lb">Agenda</span></button>
      <button data-v="pla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span class="lb">Plazos</span></button>
      <button data-v="esc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span class="lb">Escritos</span></button>
    </nav>
    <div class="me"><div class="av" style="background:#F2C7CE;color:#7B2D3B">LS</div><div><div style="font-weight:600">Dra. Laura Sosa</div><div style="color:#9AA6B2;font-size:12px">3 personas en el estudio</div></div></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DC=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const T0=new Date();T0.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

function av(r){const u=USERS[r];return `<span class="av" style="width:22px;height:22px;font-size:10px;display:inline-grid;background:${u.bg};color:${u.c}" title="${u.n}">${r}</span>`}

function go(v){VIEW=v;CUR=null;ESC=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0)}

function openExp(i,tab){VIEW='exp';CUR=i;TAB=tab||'mov';ESC=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==='exp'));render();window.scrollTo(0,0)}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

function badge(){const n=allTasks().filter(t=>!t.ok&&((t.f===TODAY&&t.tipo==='venc')||t.f<TODAY)).length;const b=$('#bHoy');b.textContent=n||'';b.style.display=n?'':'none'}

function taskRow(t,showExp=true){
  const late=!t.ok&&t.f<TODAY;
  return `<div class="item${t.ok?' done':''}">
    <button class="chk${t.ok?' done':''}" aria-label="Marcar como hecha" onclick="toggleT('${t.e.id}','${t.id}')"></button>
    ${t.h?`<div class="when">${t.h}</div>`:''}
    <div style="min-width:0;flex:1">
      <div class="tt">${esc(t.t)}</div>
      <div class="meta">${tagFor(t)} ${late?'<span class="tag venc">Atrasada</span> ':''}${showExp?`<button class="lnk" onclick="openExp('${t.e.id}','tar')">${esc(t.e.act.split(',')[0])}${t.e.dem?' c/ '+esc(t.e.dem.split(',')[0]):''} · ${esc(t.e.num)}</button>`:''}</div>
    </div>${av(t.e.r)}</div>`;
}
function toggleT(eid,tid){const t=ex(eid).tar.find(x=>x.id===tid);t.ok=!t.ok;toast(t.ok?'Tarea marcada como hecha':'Tarea pendiente otra vez');render()}

/* ---------- PLAZOS ---------- */
function calc(){
  const d0=fromKey(PL.desde);const n=Math.max(1,Math.min(365,parseInt(PL.dias)||1));
  const skipped=[];let d=new Date(d0),c=0;
  if(PL.tipo==='habiles'){while(c<n){d=addD(d,1);const ih=inhabil(d);if(ih){skipped.push([key(d),ih])}else c++}}
  else{d=addD(d0,n);while(inhabil(d)){skipped.push([key(d),inhabil(d)]);d=addD(d,1)}}
  let r=new Date(d),m=Math.max(0,parseInt(PL.margen)||0),k=0;while(k<m){r=addD(r,-1);if(!inhabil(r))k++}
  return {venc:d,listo:r,skipped,n};
}
